<!doctype html>
<html lang="hu" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E" />
    <title>Debug · Célpontok</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="../../shared/theme.js"></script>
  </head>
  <body class="container py-4">
    <h1 class="h3">🐞 Debug – Célpontok</h1>
    <p class="text-body-secondary">
      Nyisd meg a DevTools <b>Sources</b> paneljét, tegyél breakpointot a <code>buggy.js</code>-ben, majd frissítsd az oldalt.
    </p>
    <table class="table">
      <thead>
        <tr><th>Függvény</th><th>Várt</th><th>Kapott</th></tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <a href="../index.html">← vissza a modulhoz</a>

    <!-- Kész tesztkód – ezt nem kell módosítani. -->
    <script type="module">
      import { converter, closestThree } from "./buggy.js"

      const sample = () => [
        { name: "Mars", distanceMkm: 54.6, avgTempC: -63 },
        { name: "Hold", distanceMkm: 0.384, avgTempC: -20 },
        { name: "Jupiter", distanceMkm: 588, avgTempC: -110 },
        { name: "Vénusz", distanceMkm: 38.2, avgTempC: 464 }
      ]

      const cases = [
        ["converter.toKelvin(sample).join()", "210.15,253.15,163.15,737.15", () => converter.toKelvin(sample()).join()],
        ["closestThree(sample).join()", "Hold,Vénusz,Mars", () => closestThree(sample()).join()],
        ["az eredeti tömb első eleme closestThree után", "Mars", () => {
          const list = sample()
          closestThree(list)
          return list[0].name
        }]
      ]

      for (const [label, expected, run] of cases) {
        let actual
        try {
          actual = run()
        } catch (error) {
          actual = `${error.name}: ${error.message}`
        }
        const row = document.createElement("tr")
        row.className = actual === expected ? "table-success" : "table-danger"
        for (const text of [label, expected, actual]) {
          const td = document.createElement("td")
          td.textContent = String(text)
          row.appendChild(td)
        }
        document.querySelector("#results").appendChild(row)
      }
    </script>
  </body>
</html>
