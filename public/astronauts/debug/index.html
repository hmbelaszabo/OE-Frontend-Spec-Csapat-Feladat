<!doctype html>
<html lang="hu" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E" />
    <title>Debug · Asztronauták</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="../../shared/theme.js"></script>
  </head>
  <body class="container py-4">
    <h1 class="h3">🐞 Debug – Asztronauták</h1>
    <p class="text-body-secondary">
      Nyisd meg a DevTools <b>Sources</b> paneljét, tegyél breakpointot a <code>buggy.js</code>-ben, majd frissítsd az oldalt.
    </p>
    <table class="table">
      <thead>
        <tr><th>Függvény</th><th>Várt</th><th>Kapott</th></tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <a href="../index.html">← vissza a modulhoz</a>

    <!-- Kész tesztkód – ezt nem kell módosítani. -->
    <script type="module">
      import { countCommanders, crewReport } from "./buggy.js"

      const sample = [
        { name: "A", isCommander: true },
        { name: "B", isCommander: false },
        { name: "C", isCommander: false }
      ]

      const cases = [
        ["countCommanders(sample)", 1, () => countCommanders(sample)],
        ['crewReport.labels(sample).join(" | ")', "Űrhajós: A | Űrhajós: B | Űrhajós: C", () => crewReport.labels(sample).join(" | ")]
      ]

      for (const [label, expected, run] of cases) {
        let actual
        try {
          actual = run()
        } catch (error) {
          actual = `${error.name}: ${error.message}`
        }
        const row = document.createElement("tr")
        row.className = actual === expected ? "table-success" : "table-danger"
        for (const text of [label, expected, actual]) {
          const td = document.createElement("td")
          td.textContent = String(text)
          row.appendChild(td)
        }
        document.querySelector("#results").appendChild(row)
      }
    </script>
  </body>
</html>
